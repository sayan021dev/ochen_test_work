name: slozheno-prod
services:
  web:
    image: slozheno-web:${RELEASE_SHA:?Set RELEASE_SHA to the deployed Git commit}
    build:
      context: .
      args:
        GIT_REVISION: ${RELEASE_SHA:?Set RELEASE_SHA}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OCHEN_APP_PORT:-18017}:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://illustrations:${POSTGRES_PASSWORD:?Run production setup}@db:5432/illustrations
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6-luna}
      HTTP_PROXY: ${HTTP_PROXY:-}
      ALLOWED_ORIGINS: '["https://true-4.ru"]'
      SITE_PASSWORD: ${SITE_PASSWORD:?Set the access password in Termius}
      AUTH_SECRET: ${AUTH_SECRET:?Set a stable auth secret}
      REQUIRE_SITE_PASSWORD: "true"
      COOKIE_SECURE: "true"
      CUSTOM_SHADOWS_ENABLED: ${CUSTOM_SHADOWS_ENABLED:-true}
      AI_REQUEST_LIMIT: ${AI_REQUEST_LIMIT:-100}
      AI_SESSION_LIMIT: ${AI_SESSION_LIMIT:-20}
    networks:
      backend:
      edge:
        aliases:
          - slozheno-web
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from http.client import HTTPConnection; c=HTTPConnection('127.0.0.1',8000); c.request('GET','/api/ready'); assert c.getresponse().status==200"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: illustrations
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run production setup}
      POSTGRES_DB: illustrations
    networks:
      - backend
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U illustrations -d illustrations"]
      interval: 3s
      timeout: 3s
      retries: 20
    logging: *logging
networks:
  backend:
    internal: true
  edge:
volumes:
  postgres-data:
