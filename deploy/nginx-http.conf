# BEGIN SLOZHENO true-4.ru
# Bootstrap only: keep the application unavailable until TLS and its password are ready.
server {
    listen 80;
    server_name true-4.ru;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / { return 503; }
}
# END SLOZHENO true-4.ru
