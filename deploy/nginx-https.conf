# BEGIN SLOZHENO true-4.ru
server {
    listen 80;
    server_name true-4.ru;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / { return 301 https://true-4.ru$request_uri; }
}
server {
    listen 443 ssl;
    server_name true-4.ru;
    ssl_certificate /etc/letsencrypt/live/true-4.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/true-4.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 256k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    location / {
        # Resolve again after replacing the web container; no fixed container IP.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $slozheno_upstream http://slozheno-web:8000;
        proxy_pass $slozheno_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
# END SLOZHENO true-4.ru
