[project]
name = "ochen-illustrations"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.162.2", "uvicorn[standard]==0.54.0", "pydantic-settings==2.16.2",
  "sqlalchemy==2.1.8", "psycopg[binary]==3.3.8", "alembic==1.20.1",
  "httpx==0.28.1", "defusedxml==0.7.1",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "pytest-cov==7.1.0", "ruff==0.17.4"]

[tool.pytest.ini_options]
pythonpath = ["backend", "."]
testpaths = ["backend/tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
